name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build LocalRack.csproj -c Release

  release:
    name: Release
    # Runs only for version tags, e.g. `git tag -a v1.0.1 -m "LocalRack v1.0.1" && git push origin v1.0.1`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version and release notes
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag '$env:TAG' must look like v1.2.3"
          }
          $notes = "docs/releases/$env:TAG.md"
          if (-not (Test-Path $notes)) {
            throw "Missing release notes: add $notes before tagging."
          }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          "NOTES=$notes" >> $env:GITHUB_ENV

      - name: Publish single-file exe
        run: dotnet publish LocalRack.csproj -c Release -r win-x64 -o publish -p:Version=${{ env.VERSION }}

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/LocalRack-$env:TAG-win-x64.exe"
          Copy-Item publish/LocalRack.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $exe -Leaf)" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG (Get-ChildItem dist).FullName `
            --title "LocalRack $env:TAG" `
            --notes-file $env:NOTES `
            --verify-tag
